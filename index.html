<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkApp</title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <h1 class="logo">ParkApp</h1>
    <p class="lema">Reserva tu plaza fácilmente</p>
  </div>

  <div class="header-right" id="headerBtns">
    <button class="btn-header" id="btnHeaderCrear">Crear cuenta</button>
    <button class="btn-header" id="btnHeaderLogin">Iniciar sesión</button>
  </div>

  <div class="header-right" id="headerUser" style="display:none;">
    <span id="usuarioActual"></span>

    <!-- 🔥 BOTÓN ADMIN BIEN UBICADO -->
    <button id="btnAdmin" class="btn-header" style="display:none;">
      Panel Admin
    </button>

    <button class="btn-header" id="btnLogout">Cerrar sesión</button>
  </div>
</header>

<!-- TODO LO DEMÁS IGUAL ↓↓↓ -->

<section class="categorias">
  <h2>Categorías de vehículos</h2>
  <div class="categoria-container">
    <div class="categoria-card" data-tipo="automovil">
      <img src="img/automovil.png">
      <p>Automóvil</p>
    </div>
    <div class="categoria-card" data-tipo="camioneta">
      <img src="img/camioneta.png">
      <p>Camioneta</p>
    </div>
    <div class="categoria-card" data-tipo="moto">
      <img src="img/moto.png">
      <p>Moto</p>
    </div>
  </div>
</section>

<!-- (NO CAMBIÉ NADA MÁS) -->

<script type="module" src="js/main.js"></script>
</body>
</html>
